          colors: {
            brandDark: '#0e1013',
            brandDarkSurface: '#16181d',
            brandDarkElevated: '#1f2229',
            brandPillDark: '#282b34',
            brandLimeAccent: '#d2f954',
            brandLimeVibrant: '#e8ff3b',
            brandMintCard: '#ccf88b',
            brandBorderDim: '#252932',

          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Roboto', 'sans-serif'],

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-white font-sans antialiased selection:bg-brandLimeAccent selection:text-black">

<!-- BEGIN: iOSStatusBar -->

<header class="w-full pt-3 px-7 pb-2 flex justify-between items-center text-xs tracking-tight font-medium text-white/90 z-20 shrink-0" data-purpose="status-bar">

<div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-white rounded-2xs"></div>
</div>
</div>

<!-- END: iOSStatusBar -->
<!-- BEGIN: AppHeader -->

<span class="text-base font-extrabold mt-0.5 leading-none">3</span>

<!-- Inactive Day: Tuesday 4 -->
<button class="flex flex-col items-center justify-center w-10 py-1.5 rounded-xl text-white/90 hover:bg-white/5 transition-colors">

<!-- Inactive Day: Wednesday 5 -->
<button class="flex flex-col items-center justify-center w-10 py-1.5 rounded-xl text-white/90 hover:bg-white/5 transition-colors">

</div>

<!-- BEGIN: FloatingCapsuleNavBar -->
